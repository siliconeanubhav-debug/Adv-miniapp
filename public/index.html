<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Premium - Marketplace Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1014; color: #ffffff; padding-bottom: 90px; }
        .container { max-width: 500px; margin: auto; padding: 15px; }

        /* Header Styles */
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand-logo { font-size: 24px; font-weight: 800; }
        .brand-logo span { background: #ff9900; color: #000; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; }
        .vip-status-badge { background: rgba(255,153,0,0.15); border: 1px solid #ff9900; color: #ff9900; font-size: 11px; padding: 5px 12px; border-radius: 20px; font-weight: bold; }

        /* 5-Banner Image Carousel */
        .carousel-container { position: relative; width: 100%; height: 220px; border-radius: 20px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .carousel-slide { display: none; width: 100%; height: 100%; background-size: cover; background-position: center; flex-direction: column; justify-content: flex-end; padding: 20px; position: relative; transition: opacity 0.5s ease-in-out; }
        .carousel-slide.active { display: flex; }
        .carousel-slide::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, #0f1014 15%, transparent 100%); z-index: 1; }
        .banner-content { position: relative; z-index: 2; }
        .tag-trending { background: #ff5500; color: #fff; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 20px; display: inline-block; margin-bottom: 5px; text-transform: uppercase; }
        .banner-title { font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .carousel-dots { position: absolute; bottom: 10px; right: 20px; display: flex; gap: 5px; z-index: 3; }
        .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.4); border-radius: 50%; transition: 0.2s; }
        .dot.active { background: #ff9900; width: 15px; border-radius: 10px; }

        /* Grid Layout */
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .show-card { background: #1a1b24; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; cursor: pointer; }
        .show-card img { width: 100%; aspect-ratio: 1/1.2; object-fit: cover; }
        .card-details { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .card-tag { font-size: 11px; color: #ff5500; font-weight: 700; }

        /* Button UI Elements */
        .btn { background: #ff5500; color: white; border: none; padding: 12px 16px; border-radius: 12px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; }
        .btn-block { width: 100%; margin-top: 10px; }
        .btn-ad { background: #0088cc; }
        .btn-premium { background: #ff9900; color: #000; }

        /* Form Controls */
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
        .form-control { width: 100%; background: #12131a; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: white; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #ff9900; }

        /* Plan UI */
        .plan-card { background: #1a1b24; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 15px; text-align: left; }
        .plan-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .plan-price { font-size: 24px; font-weight: 800; color: #ff9900; margin-bottom: 10px; }

        /* Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #1a1b24; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7a7e8c; background: none; border: none; font-size: 11px; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: #ff5500; }
        
        .screen { display: none; }
        .screen.active { display: block; }
        .admin-section { background: #1a1b24; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Dashboard -->
    <div class="top-header">
        <div class="brand-logo">AC <span>PREMIUM</span></div>
        <div id="vip-badge" class="vip-status-badge"><i class="fa-solid fa-star"></i> FREE USER</div>
    </div>

    <!-- ================= SCREEN 1: HOME SCREEN ================= -->
    <div id="home-screen" class="screen active">
        <!-- 5-Banner Image Carousel Sliders -->
        <div class="carousel-container" id="carousel-wrapper">
            <!-- Dynamic slides will populate here -->
        </div>

        <h3 style="margin-bottom: 15px; font-size: 15px; letter-spacing: 0.5px; color: #aaa;"><i class="fa-solid fa-fire" style="color:#ff5500;"></i> TOP TRENDING SERIES</h3>
        <div id="stories-grid" class="grid-container"></div>
    </div>

    <!-- ================= SCREEN 2: PLAYER / AUDIO CONTAINER ================= -->
    <div id="player-screen" class="screen">
        <div style="background: #1a1b24; padding: 20px; border-radius: 20px; text-align: center;">
            <button class="btn btn-secondary" onclick="switchScreen('home-screen')" style="padding: 6px 12px; font-size:12px; float:left;"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <div style="clear:both;"></div>
            <img id="player-cover" style="width:180px; height:180px; border-radius:16px; object-fit:cover; margin:15px 0; box-shadow: 0 8px 20px rgba(0,0,0,0.5);" src="" alt="">
            <h3 id="player-title" style="margin-bottom:15px;">Show Title</h3>
            <div id="link-container"></div>
        </div>
    </div>

    <!-- ================= SCREEN 3: VIP PASS MEMBERSHIPS ================= -->
    <div id="vip-screen" class="screen">
        <h2 style="text-align: center; margin-bottom: 20px; color: #ff9900;"><i class="fa-solid fa-crown"></i> Select VIP Membership Plan</h2>
        <div class="plan-card">
            <div class="plan-title">7 Days Pass (Weekly)</div>
            <div class="plan-price">₹15</div>
            <button class="btn btn-block" onclick="openPayment(15, '7 Days')">Purchase Now</button>
        </div>
        <div class="plan-card" style="border-color: #ff9900;">
            <div class="plan-title">15 Days Pass (Semi-Monthly)</div>
            <div class="plan-price">₹25</div>
            <button class="btn btn-block" onclick="openPayment(25, '15 Days')">Purchase Now</button>
        </div>
        <div class="plan-card">
            <div class="plan-title">30 Days Pass (Monthly Plan)</div>
            <div class="plan-price">₹50</div>
            <button class="btn btn-block" onclick="openPayment(50, '30 Days')">Purchase Now</button>
        </div>
    </div>

    <!-- ================= SCREEN 4: PAYMENT LINK EXECUTION ================= -->
    <div id="payment-screen" class="screen" style="text-align: center;">
        <div style="background:#1a1b24; padding:25px; border-radius:20px;">
            <h3>💳 UPI Secure Gateway</h3>
            <p style="margin: 15px 0; color:#aaa;">Amount Payable: <span id="pay-amount" style="color:#ff9900; font-weight:bold;"></span></p>
            <a id="upi-pay-link" href="#" class="btn btn-premium btn-block" style="background:#00cc66; color:#fff; padding:14px;"><i class="fa-solid fa-mobile-screen-button"></i> Pay via UPI App</a>
            <button class="btn btn-secondary btn-block" onclick="switchScreen('vip-screen')" style="margin-top:10px;">Cancel Transaction</button>
        </div>
    </div>

    <!-- ================= SCREEN 5: ADMIN FULL CONTROL PANEL ================= -->
    <div id="admin-screen" class="screen">
        <h2 style="margin-bottom: 20px; color:#ff9900;"><i class="fa-solid fa-user-gear"></i> Control Engine</h2>
        
        <!-- Tab 1: Content Creator Form -->
        <div class="admin-section">
            <h4 style="margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; color:#ff5500;"><i class="fa-solid fa-folder-plus"></i> Upload New Story</h4>
            <div class="form-group"><label>Story Title</label><input type="text" id="adm-title" class="form-control" placeholder="e.g., Ek Ishq Ek Junoon"></div>
            <div class="form-group"><label>Cover Photo Image URL</label><input type="text" id="adm-cover" class="form-control" placeholder="https://image-url.com/pic.jpg"></div>
            <div class="form-group"><label>Category Tag</label><input type="text" id="adm-tag" class="form-control" placeholder="Romance / Thriller / Horror"></div>
            <div class="form-group"><label>Original Link (For Premium Users Only)</label><input type="text" id="adm-simple" class="form-control" placeholder="Direct Telegram / Drive Video Link"></div>
            <div class="form-group"><label>Ad-Shortener Link (For Free Users)</label><input type="text" id="adm-ad" class="form-control" placeholder="https://gplinks.co/xyz"></div>
            <button class="btn btn-block" onclick="submitStory()"><i class="fa-solid fa-cloud-arrow-up"></i> Push Story to Database</button>
        </div>

        <!-- Tab 2: 5-Banner Customization Matrix -->
        <div class="admin-section">
            <h4 style="margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; color:#ffaa00;"><i class="fa-solid fa-images"></i> Slider Management (Top 5 Banners)</h4>
            <div id="banner-inputs-container">
                <!-- 5 Dynamic Input Rows generated via JavaScript -->
            </div>
            <button class="btn btn-block btn-premium" onclick="saveBanners()"><i class="fa-solid fa-floppy-disk"></i> Update Carousel Banners</button>
        </div>
    </div>
</div>

<!-- Global Navigation Footer Bar -->
<div class="bottom-nav">
    <button class="nav-item active" onclick="switchScreen('home-screen', this)"><i class="fa-solid fa-house"></i>HOME</button>
    <button class="nav-item" onclick="switchScreen('vip-screen', this)"><i class="fa-solid fa-crown"></i>VIP PASS</button>
    <button class="nav-item" onclick="switchScreen('admin-screen', this)"><i class="fa-solid fa-user-gear"></i>ADMIN</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    const API_URL = window.location.origin;
    let isVipUser = false; 
    let allStories = [];
    let currentSlideIndex = 0;

    // Change your static UPI configuration details here
    const MERCHANT_UPI_ID = "your-upi-id@ybl";

    // Standard Mock Data Setup for Top 5 banners
    let defaultBanners = [
        { title: "Ek Ishq Ek Junoon", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500" },
        { title: "Secret Billionaire", image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500" },
        { title: "The Dark Night Story", image: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500" },
        { title: "Vampire Returns", image: "https://images.unsplash.com/photo-1516339901601-2e1d62dc0c45?w=500" },
        { title: "Love in Paris", image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=500" }
    ];

    window.addEventListener('load', async () => {
        setupAdminBannerFields();
        renderCarousel();
        startCarouselTimer();
        await loadStories();
    });

    // Populate configurations inside the Admin panel setup
    function setupAdminBannerFields() {
        const container = document.getElementById('banner-inputs-container');
        container.innerHTML = '';
        defaultBanners.forEach((b, i) => {
            container.innerHTML += `
                <div style="margin-bottom:12px; background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;">
                    <strong style="font-size:11px; color:#ff9900;">BANNER SLOT 0${i+1}</strong>
                    <input type="text" id="bm-title-${i}" class="form-control" style="margin:5px 0;" value="${b.title}" placeholder="Banner Title">
                    <input type="text" id="bm-img-${i}" class="form-control" value="${b.image}" placeholder="Image URL">
                </div>
            `;
        });
    }

    // Build Banner Carousel structure
    function renderCarousel() {
        const wrapper = document.getElementById('carousel-wrapper');
        wrapper.innerHTML = '';
        
        let slidesHtml = '';
        let dotsHtml = '<div class="carousel-dots">';
        
        defaultBanners.forEach((b, i) => {
            slidesHtml += `
                <div class="carousel-slide ${i === 0 ? 'active' : ''}" style="background-image: url('${b.image}');">
                    <div class="banner-content">
                        <span class="tag-trending"><i class="fa-solid fa-fire"></i> Trending Stage</span>
                        <h2 class="banner-title">${b.title}</h2>
                    </div>
                </div>
            `;
            dotsHtml += `<span class="dot ${i === 0 ? 'active' : ''}"></span>`;
        });
        dotsHtml += '</div>';
        wrapper.innerHTML = slidesHtml + dotsHtml;
    }

    // Carousel Automated Rotator Engine
    function startCarouselTimer() {
        setInterval(() => {
            const slides = document.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.dot');
            if(!slides.length) return;

            slides[currentSlideIndex].classList.remove('active');
            dots[currentSlideIndex].classList.remove('active');
            
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            
            slides[currentSlideIndex].classList.add('active');
            dots[currentSlideIndex].classList.add('active');
        }, 4000);
    }

    // Update Banner state globally
    function saveBanners() {
        for(let i=0; i<5; i++) {
            defaultBanners[i].title = document.getElementById(`bm-title-${i}`).value;
            defaultBanners[i].image = document.getElementById(`bm-img-${i}`).value;
        }
        renderCarousel();
        alert('🎯 All 5 Banners modified inside the active session context successfully!');
    }

    // Dynamic UI Screen router configuration 
    function switchScreen(screenId, element = null) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(element) {
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            element.classList.add('active');
        }
    }

    // Fetch operational records from Database
    async function loadStories() {
        try {
            const res = await fetch(`${API_URL}/api/stories`);
            allStories = await res.json();
            
            const grid = document.getElementById('stories-grid');
            grid.innerHTML = '';
            allStories.forEach(story => {
                grid.innerHTML += `
                    <div class="show-card" onclick="openPlayer('${story._id}')">
                        <img src="${story.cover}" alt="Poster">
                        <div class="card-details">
                            <h4 class="card-title">${story.title}</h4>
                            <span class="card-tag">${story.tag}</span>
                        </div>
                    </div>
                `;
            });
        } catch(e) { console.error("Data synchronization error across API layers"); }
    }

    // Push new entry straight into MongoDB via API request mapping
    async function submitStory() {
        const title = document.getElementById('adm-title').value;
        const cover = document.getElementById('adm-cover').value;
        const tag = document.getElementById('adm-tag').value;
        const simple_link = document.getElementById('adm-simple').value;
        const ad_link = document.getElementById('adm-ad').value;

        if(!title || !cover || !tag || !simple_link || !ad_link) {
            alert('⚠️ Please fill out all configuration parameters!');
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/stories`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, cover, tag, simple_link, ad_link })
            });

            if(res.ok) {
                alert('🚀 Story saved successfully into MongoDB cluster!');
                // Reset form fields
                document.getElementById('adm-title').value = '';
                document.getElementById('adm-cover').value = '';
                document.getElementById('adm-simple').value = '';
                document.getElementById('adm-ad').value = '';
                await loadStories();
                switchScreen('home-screen');
            }
        } catch(e) { alert('Failed processing server API push operations.'); }
    }

    // User content authentication distribution filter
    function openPlayer(id) {
        const story = allStories.find(s => s._id === id);
        if(!story) return;

        switchScreen('player-screen');
        document.getElementById('player-title').innerText = story.title;
        document.getElementById('player-cover').src = story.cover;

        const container = document.getElementById('link-container');
        container.innerHTML = '';

        if(isVipUser) {
            container.innerHTML = `
                <p style="color:#00cc66; font-size:13px; margin-bottom:12px;"><i class="fa-solid fa-unlock"></i> Premium Unlocked Account Active</p>
                <a href="${story.simple_link}" target="_blank" class="btn btn-premium btn-block"><i class="fa-solid fa-circle-play"></i> Watch Stream (No Ads)</a>
            `;
        } else {
            container.innerHTML = `
                <p style="color:#aaa; font-size:12px; margin-bottom:12px;"><i class="fa-solid fa-lock"></i> Free account contains dynamic link restrictions.</p>
                <a href="${story.ad_link}" target="_blank" class="btn btn-ad btn-block"><i class="fa-solid fa-rectangle-ad"></i> Stream with Ad-Access</a>
            `;
        }
    }

    function openPayment(amount, plan) {
        switchScreen('payment-screen');
        document.getElementById('pay-amount').innerText = "INR " + amount;
        document.getElementById('upi-pay-link').href = `upi://pay?pa=${MERCHANT_UPI_ID}&pn=AC_Premium&am=${amount}&cu=INR&tn=VIP_${plan}`;
    }
</script>
</body>
</html>
